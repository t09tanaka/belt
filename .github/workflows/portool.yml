name: portool

# The gates of crates/portool, ported from its own repository's ci.yml. Every
# run step starts in crates/portool and every cargo command carries -p portool,
# so the jobs act on the member only. belt's ci.yml keeps belt's gates.
on:
  push:
    branches: [main]
    paths:
      - "crates/portool/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - ".github/workflows/portool.yml"
  pull_request:
    paths:
      - "crates/portool/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - ".github/workflows/portool.yml"

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crates/portool

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portool-test

      - name: cargo fmt --check
        run: cargo fmt -p portool --check

      - name: cargo clippy
        run: cargo clippy -p portool --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p portool

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - run: cargo check -p portool --all-targets
