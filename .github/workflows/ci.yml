name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The test binaries need line tables for backtraces, not full debug
      # info: less to write (and, on macOS, to run dsymutil over) per build.
      # Set for the whole job so the rust-cache key sees it; the coverage and
      # mutation jobs are not touched.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: git-lfs (the source tests use the real thing)
        run: |
          git lfs version || {
            if [ "$RUNNER_OS" = "macOS" ]; then brew install git-lfs; else sudo apt-get update && sudo apt-get install -y git-lfs; fi
          }
          git lfs version
      - name: mutation selection policy
        run: python3 scripts/mutation-policy-test.py
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: install fast-worktree
        # A cached older binary lacks the cross-process worktree registration
        # lock added in 0.4.0, so check the version, not just the presence.
        run: |
          if ! fast-worktree --version 2>/dev/null | grep -qx 'fast-worktree 0\.4\.0'; then
            cargo install fast-worktree --locked --version 0.4.0 --force
          fi
          fast-worktree --version
      - name: install task-traffic-controller
        # The nested-scope test runs the real CLI from a step. The library is
        # pinned to 0.10.x and the CLI must write the ledger it reads, so
        # check the version, not just the presence.
        run: |
          if ! task-traffic-controller --version 2>/dev/null | grep -qx 'task-traffic-controller 0\.10\.2'; then
            cargo install task-traffic-controller --locked --version 0.10.2 --force
          fi
          task-traffic-controller --version
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - name: cargo nextest
        env:
          # the workspace tests run the real tool; its absence is a failure
          RTR_REQUIRE_FAST_WORKTREE: "1"
          # the same for the task-traffic-controller CLI a step calls
          RTR_REQUIRE_TTC_CLI: "1"
        # every failing test is listed in one run; a failure still fails the job
        run: cargo nextest run --workspace --all-targets --no-fail-fast

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - run: cargo check --all-targets

  coverage:
    name: coverage gate (pure modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: git-lfs (the source tests use the real thing)
        run: |
          git lfs version || { sudo apt-get update && sudo apt-get install -y git-lfs; }
          git lfs version
      - name: install fast-worktree
        # A cached older binary lacks the cross-process worktree registration
        # lock added in 0.4.0, so check the version, not just the presence.
        run: |
          if ! fast-worktree --version 2>/dev/null | grep -qx 'fast-worktree 0\.4\.0'; then
            cargo install fast-worktree --locked --version 0.4.0 --force
          fi
          fast-worktree --version
      - name: 100% line coverage on the listed pure modules
        run: ./scripts/coverage-gate.sh

  # scripts/pure-modules.txt is shared by mutation and coverage gates.
  # The mutants are split over 4 parallel shards (cargo-schemata --shard K/4:
  # every mutant belongs to exactly one shard, run exactly as in an unsharded
  # run). The `mutation gate (pure modules)` job below merges the parts and is
  # the only required result.
  mutants-shard:
    name: mutation shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      # cargo-schemata uses the Rust test harness for baseline and mutant runs.
      # Pure mutation selects module library tests and the fast config IT suite.
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation
      - name: install cargo-schemata
        run: |
          # A cached binary of another version is replaced, not reused.
          if ! cargo schemata --version 2>/dev/null | grep -qx 'cargo-schemata 0\.4\.0'; then
            cargo install cargo-schemata --locked --version 0.4.0 --force
          fi
      - name: mutate this shard
        run: python3 scripts/mutation-run.py --shard "${{ matrix.shard }}/4"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schemata-shard-${{ matrix.shard }}
          path: schemata.out
          if-no-files-found: error

  mutants-pure:
    name: mutation gate (pure modules)
    needs: mutants-shard
    # Runs even when a shard failed, so the gate itself reports the failure.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation
          save-if: false
      - name: install cargo-schemata
        run: |
          if ! cargo schemata --version 2>/dev/null | grep -qx 'cargo-schemata 0\.4\.0'; then
            cargo install cargo-schemata --locked --version 0.4.0 --force
          fi
      - name: every target file has mutants
        run: scripts/mutation-targets-check.sh $(cat scripts/pure-modules.txt)
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: schemata-shard-*
          path: parts
      - name: merge the shards, zero survivors
        env:
          SHARDS_RESULT: ${{ needs.mutants-shard.result }}
        run: |
          # Any shard that did not succeed (missed or timed-out mutants, build
          # error, cancelled, missing artifact) fails the gate.
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "mutation shards: $SHARDS_RESULT" >&2
            status=1
          fi
          for k in 0 1 2 3; do
            [ -f "parts/schemata-shard-$k/report.json" ] || { echo "missing report of shard $k" >&2; exit 1; }
          done
          cargo schemata merge parts/schemata-shard-*/report.json -o schemata.out
          echo "missed: $(wc -l < schemata.out/missed.txt), timeout: $(wc -l < schemata.out/timeout.txt)"
          [ ! -s schemata.out/missed.txt ] || { cat schemata.out/missed.txt >&2; exit 1; }
          [ ! -s schemata.out/timeout.txt ] || { cat schemata.out/timeout.txt >&2; exit 1; }
          exit "${status:-0}"
