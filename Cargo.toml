[package]
name = "remote-task-runner"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "Distribute CI and heavy commands across your own machines"
license = "MIT"
repository = "https://github.com/t09tanaka/remote-task-runner"
readme = "README.md"

[lib]
name = "remote_task_runner"
path = "src/lib.rs"

[[bin]]
name = "remote-task-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
getrandom = "0.3"
globset = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
local-ci = "0.13.0"
memchr = "2"
node-semver = "=2.2.0"
serde_yaml = "0.9"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# The ledger is shared with the CLI of the same user: stay on the minor
# whose ledger format this library reads and writes.
task-traffic-controller = "~0.10.1"
tempfile = "3"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "signal"] }
toml = "0.8"
ulid = "1"
unicode-normalization = "0.1.26"

[dev-dependencies]
assert_cmd = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[test]]
name = "it"
path = "tests/it/main.rs"

# The managed service identity hashes the whole executable (init, daemon
# startup, health). Unoptimized, SHA-256 of a 100 MB test binary takes about
# ten seconds per pass, which is the whole startup deadline of the fixtures.
[profile.dev.package.sha2]
opt-level = 3
